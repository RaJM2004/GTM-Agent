name: Build and deploy Python app to Azure Web App - gtm-backend1

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Create virtual environment and install dependencies
        working-directory: ./backend
        run: |
          python -m venv antenv
          source antenv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.prod.txt

      - name: Create deployment zip (with venv included)
        working-directory: ./backend
        run: |
          zip -r ../release.zip . \
            -x "*.pyc" \
            -x "__pycache__/*" \
            -x "venv/*" \
            -x ".env" \
            -x "*.png" \
            -x "*.jpg" \
            -x "response.json" \
            -x "test_*.py" \
            -x "check_phones.py" \
            -x "add_credits.py" \
            -x "update_ammar.py" \
            -x "script.py"

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'gtm-backend1'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_E724D499FDA047D384397534B5323A33 }}
          package: './release.zip'
